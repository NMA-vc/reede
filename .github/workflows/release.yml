# Release workflow. Owner setup steps (environment, trusted publisher) are in the maintainers' release checklist.
name: Reede release

on:
  push:
    tags: ["v*"]

# Least privilege by default; jobs raise only what they need.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match the crate version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }

      - name: Install pinned Rust toolchain (rustup is preinstalled on hosted runners)
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}" && rustup default "$RUST_TOOLCHAIN"

      - name: Test (all features, locked)
        run: cargo test --locked --all-features

      - name: Build verify and reede
        run: cargo build --locked --release --features cli,ingest --bins --target "${{ matrix.target }}"

      - name: Package and checksum
        run: |
          mkdir dist
          for bin in verify reede; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$bin-${{ matrix.target }}"
          done
          (cd dist && shasum -a 256 * > "SHA256SUMS-${{ matrix.target }}.txt")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: attest and publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation (OIDC)
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Combined checksums
        run: cd dist && cat SHA256SUMS-*.txt > SHA256SUMS && rm SHA256SUMS-*.txt

      # Owner setup: none; works in public repos. Verify with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/verify-*, dist/reede-*"

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true

  publish-crate:
    name: cargo publish (trusted publishing)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Owner setup: create a GitHub Environment named "crates-io" with required reviewers.
    # A crates.io release can only be yanked, never deleted, so keep a human gate here.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"

      # Owner setup: after the manual first publish, add a Trusted Publisher on crates.io for this
      # repo, workflow file `release.yml` and environment `crates-io` (maintainers' release checklist).
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
